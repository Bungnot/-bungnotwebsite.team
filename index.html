<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบขัดข้อง</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Tahoma", "Arial", sans-serif;
      background:
        radial-gradient(circle at top, rgba(239, 68, 68, 0.18), transparent 35%),
        linear-gradient(135deg, #0f172a 0%, #111827 50%, #020617 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .system-card {
      width: min(680px, 100%);
      text-align: center;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 48px 28px;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
    }

    .icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 28px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(239, 68, 68, 0.16);
      border: 2px solid rgba(248, 113, 113, 0.45);
      font-size: 46px;
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.18);
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1.15;
      font-weight: 800;
      color: #fef2f2;
      margin-bottom: 18px;
      letter-spacing: -0.04em;
    }

    p {
      font-size: clamp(1.1rem, 3vw, 1.55rem);
      line-height: 1.7;
      color: #cbd5e1;
      font-weight: 500;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(248, 113, 113, 0.12);
      color: #fecaca;
      border: 1px solid rgba(248, 113, 113, 0.24);
      font-weight: 700;
      font-size: 0.98rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 0 6px rgba(239, 68, 68, 0.16);
    }

    @media (max-width: 480px) {
      .system-card {
        padding: 38px 20px;
        border-radius: 22px;
      }

      .icon {
        width: 78px;
        height: 78px;
        font-size: 38px;
      }
    }
  </style>
</head>
<body>
  <main class="system-card" role="main" aria-label="แจ้งเตือนระบบขัดข้อง">
    <div class="icon" aria-hidden="true">⚠️</div>
    <h1>ไม่สามารถเข้าระบบได้</h1>
    <p>เนื่องจากระบบขัดข้อง</p>
    <div class="status">
      <span class="dot" aria-hidden="true"></span>
      กรุณาลองใหม่อีกครั้งภายหลัง
    </div>
  </main>
</body>
</html>
